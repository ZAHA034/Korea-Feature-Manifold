[project]
name = "kfm-spike"
version = "0.1.0"
description = "KFM 0S exploration environment (separate from the main project venv C:/dev/kfm-venv)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb>=1.5.6",
    "geoopt>=0.5.1",
    "geopandas>=1.2.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "numba>=0.68.0",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pot>=0.9.7.post1",
    "pyarrow>=26.0.0",
    "pyproj>=3.7.2",
    "rasterio>=1.4.4",
    "scipy>=1.17.1",
    "shapely>=2.2.0",
    "torch>=2.14.1",
]

[tool.uv]
# Resolve only for Windows PyPI wheels (torch is the CPU build there); keeps the lock file small.
environments = ["sys_platform == 'win32'"]
